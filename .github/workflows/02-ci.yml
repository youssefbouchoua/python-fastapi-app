
name: CI

on: [push]
env:
  APP_NAME: fastapi-starter

jobs:
  lint:
    name: Lint - Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Installer les dependances
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Verifier le style
        run: ruff check .

  build:
    name: Build - Verifier application
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Installer les dependances
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Compiler le code
        run: python -m compileall app

      - name: Importer application
        run: python -c "from app.main import app; print(app.title)"

  test:
    name: Test - Pytest
    needs: [lint, build]
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Installer les dependances
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Executer les tests
        run: pytest
      
      - name: Afficher les contextes
        env:
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          RUNNER_OS: ${{ runner.os }}
        run: |
          echo "Application: $APP_NAME"
          echo "Acteur: $ACTOR"
          echo "Evenement: $EVENT_NAME"
          echo "Branche: $BRANCH"
          echo "SHA: $COMMIT_SHA"
          echo "OS du runner: $RUNNER_OS"

