
name: Third-Party and Custom Actions Lab

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Run build info action
        id: info
        uses: ./.github/actions/build-info
        with:
          app-name: my-app

      - name: Print build id
        run: echo "Build id is ${{ steps.info.outputs.build-id }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Print Node.js version
        run: node --version

      - name: Generate build report
        run: |
          echo "Node.js version: $(node --version)" > report.txt
          echo "Build date: $(date +%F)" >> report.txt

      - name: Upload build report
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: report.txt

  verify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build report
        uses: actions/download-artifact@v4
        with:
          name: build-report

      - name: Print build report
        run: cat report.txt
  
  docker-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Docker hello action
        uses: ./.github/actions/docker-hello
        with:
          who: GitHub Actions
